name: Build daily AI digest

on:
  schedule:
    - cron: '17 7 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build public digest
        run: python3 scripts/build_daily.py
      - name: Publish public digest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily.json archive/daily
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily AI digest'
            git push
          fi
